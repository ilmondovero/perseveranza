name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Configure git identity (e2e tests commit on local remotes)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - run: npm test
        env:
          OMC_LOOP_NO_NOTIFY: "1"

  bench-dry:
    name: bench (dry run, no claude)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runner and evaluator self-check
        run: python bench/task/reference/reference_target_agent.py --dry-run
        env:
          PERSEVERANZA_ROOT: ${{ github.workspace }}
